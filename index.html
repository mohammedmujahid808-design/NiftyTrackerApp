<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty Tracker App</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            padding: 15px;
            background: #161b22;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #30363d;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #58a6ff;
        }
        .card {
            background: #161b22;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #30363d;
        }
        .chart-container {
            height: 400px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📈 Nifty Tracker App</h1>
        <p style="font-size: 13px; color: #8b949e; margin: 5px 0 0;">Live Market & Technical Signals</p>
    </div>

    <!-- Live Chart Widget -->
    <div class="card">
        <h3 style="margin-top: 0;">Live Nifty 50 Chart</h3>
        <div class="chart-container">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div id="tradingview_chart" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "NSE:NIFTY",
                    "interval": "15",
                    "timezone": "Asia/Kolkata",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "hide_top_toolbar": true,
                    "save_image": false,
                    "container_id": "tradingview_chart"
                });
                </script>
            </div>
        </div>
    </div>

    <!-- Technical Signal Meter -->
    <div class="card">
        <h3 style="margin-top: 0;">Live Technical Signal</h3>
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
            {
                "interval": "15m",
                "width": "100%",
                "isTransparent": true,
                "height": 380,
                "symbol": "NSE:NIFTY",
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
            }
            </script>
        </div>
    </div>

</body>
</html>
